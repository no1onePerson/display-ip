name: Native CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Check project reproducibility
        run: |
          python3 Scripts/generate-project.py
          git diff --exit-code -- macOS/IpBan.xcodeproj macOS/Configuration
      - name: Test core
        run: |
          set -o pipefail
          swift test --package-path macOS --parallel 2>&1 | tee core-tests.log
      - name: Build and analyze native targets
        run: |
          set -o pipefail
          # Build both slices before analyze. Debug used to emit only arm64 PrismCore, then x86_64 analysis failed to import it.
          xcodebuild -project macOS/IpBan.xcodeproj -scheme IpBan -configuration Debug -derivedDataPath macOS/build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" build analyze 2>&1 | tee native-build.log
      - name: Annotate compiler failures
        if: failure()
        run: python3 Scripts/annotate-errors.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-logs
          path: '*.log'
