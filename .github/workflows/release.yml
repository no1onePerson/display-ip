name: IpBan release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_PROFILE_BASE64: ${{ secrets.APP_PROFILE_BASE64 }}
      WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Validate version and test
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python3 - "$GITHUB_REF_NAME" <<'PY'
          import re,sys
          assert re.fullmatch(r'v0\.4\.0(?:-[A-Za-z0-9.-]+)?', sys.argv[1]), 'Tag must match project version 0.4.0'
          PY
          fi
          swift test --package-path macOS
      - name: Configure optional signing
        run: |
          set -euo pipefail
          if [ -n "$CERTIFICATE_BASE64" ]; then
            : "${CERTIFICATE_PASSWORD:?}" "${SIGNING_IDENTITY:?}" "${APPLE_ID:?}" "${APPLE_APP_PASSWORD:?}" "${TEAM_ID:?}" "${APP_PROFILE_BASE64:?}" "${WIDGET_PROFILE_BASE64:?}"
            KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
            security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
            printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
            security list-keychains -d user -s build.keychain login.keychain-db
            xcrun notarytool store-credentials IpBanNotary --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$TEAM_ID" --keychain build.keychain
            printf '%s' "$APP_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
            printf '%s' "$WIDGET_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/widget.provisionprofile"
            echo 'SIGNED_RELEASE=true' >> "$GITHUB_ENV"
          else
            echo 'SIGNED_RELEASE=false' >> "$GITHUB_ENV"
          fi
      - name: Archive Release
        run: |
          set -o pipefail
          xcodebuild -project macOS/IpBan.xcodeproj -scheme IpBan -configuration Release -archivePath macOS/build/IpBan.xcarchive ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee release-build.log
      - name: Sign and notarize app
        if: env.SIGNED_RELEASE == 'true'
        run: |
          set -euo pipefail
          APP='macOS/build/IpBan.xcarchive/Products/Applications/IpBan.app'
          cp "$RUNNER_TEMP/app.provisionprofile" "$APP/Contents/embedded.provisionprofile"
          cp "$RUNNER_TEMP/widget.provisionprofile" "$APP/Contents/PlugIns/IpBanWidget.appex/Contents/embedded.provisionprofile"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --entitlements macOS/Configuration/IpBanWidget.entitlements "$APP/Contents/PlugIns/IpBanWidget.appex"
          codesign --force --options runtime --timestamp --sign "$SIGNING_IDENTITY" --entitlements macOS/Configuration/IpBan.entitlements "$APP"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --keychain-profile IpBanNotary --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
      - name: Package and verify
        run: Scripts/package.sh 'macOS/build/IpBan.xcarchive/Products/Applications/IpBan.app'
      - name: Smoke-test settings window
        run: |
          set -euo pipefail
          if ! pgrep -x WindowServer >/dev/null; then
            echo '::warning::No WindowServer is available; settings-window smoke test was skipped.'
            exit 0
          fi
          APP='macOS/build/IpBan.xcarchive/Products/Applications/IpBan.app'
          "$APP/Contents/MacOS/IpBan" --smoke-test-settings > settings-smoke.log 2>&1 &
          PID=$!
          for attempt in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" || true
            echo '::error::Settings-window smoke test timed out.'
            exit 1
          fi
          if ! wait "$PID"; then
            cat settings-smoke.log
            echo '::error::IpBan exited with an error during the settings-window smoke test.'
            exit 1
          fi
          if ! grep -q IPBAN_SETTINGS_SMOKE_OK settings-smoke.log; then
            cat settings-smoke.log
            echo '::error::Settings-window smoke test did not finish successfully.'
            exit 1
          fi
      - name: Annotate compiler failures
        if: failure()
        run: python3 Scripts/annotate-errors.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: IpBan-distribution
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$SIGNED_RELEASE" = true ]; then
            NOTES='Developer ID signed and Apple notarized. macOS 14+. Download the DMG and drag IpBan to Applications.'
          else
            NOTES='Development preview. Ad-hoc signed, NOT Developer ID signed or Apple notarized. Gatekeeper may block installation. App Group widget sharing requires proper signing. macOS 14+.'
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --prerelease --title "IpBan $GITHUB_REF_NAME" --notes "$NOTES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: release-failure-logs
          path: '*.log'
      - name: Clean signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/app.provisionprofile" "$RUNNER_TEMP/widget.provisionprofile"
          security delete-keychain build.keychain || true
